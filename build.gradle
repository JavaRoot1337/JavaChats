plugins {
    id 'java-library'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'ru.javaroot'
version = '1.0'

repositories {
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
    }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

dependencies {
    compileOnly 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
    compileOnly 'net.luckperms:api:5.4'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'com.google.code.gson:gson:2.14.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'com.destroystokyo.paper:paper-api:1.16.5-R0.1-SNAPSHOT'
    testImplementation 'net.luckperms:api:5.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}

tasks.test {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs resource and configuration integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
}

tasks.check {
    dependsOn tasks.integrationTest
}

tasks.jar {
    enabled = false
    archiveBaseName = 'JavaChats'
}

configurations {
    modernPaperApi
}

def modernPaperApiVersion = providers.gradleProperty('modernPaperApiVersion')
        .orElse('26.2.build.121-stable')

dependencies {
    modernPaperApi "io.papermc.paper:paper-api:${modernPaperApiVersion.get()}"
    modernPaperApi 'net.luckperms:api:5.4'
    modernPaperApi 'org.bstats:bstats-bukkit:3.2.1'
    modernPaperApi 'com.google.code.gson:gson:2.14.0'
}

tasks.register('compileModernJava', JavaCompile) {
    description = 'Compiles the plugin sources against the modern Paper API.'
    group = 'verification'
    source = sourceSets.main.java
    classpath = configurations.modernPaperApi
    destinationDirectory = layout.buildDirectory.dir('classes/java/modern')
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:all']
}

tasks.check {
    dependsOn tasks.compileModernJava
}

tasks.shadowJar {
    archiveBaseName = 'JavaChats'
    archiveClassifier = ''
    relocate 'com.google.gson', 'ru.javaroot.libs.gson'
    relocate 'org.bstats', 'ru.javaroot.javachats.bstats.library'
    mergeServiceFiles()
}

tasks.build {
    dependsOn tasks.shadowJar
}
