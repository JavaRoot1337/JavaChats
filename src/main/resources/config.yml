chats:
  local:
    enable: true
    format: '&7[&#F8AE5Bʟ&7] &f%prefix% &#F8AE5B%player% &f%suffix%&#F8AE5B:&f %message%'
    range: 100
    cooldown: -1
    viewing-perms: javachats.local.view
    sending-perms: javachats.local.send
    sound: ''

  global:
    enable: true
    format: '&7[&#FF8B1Dɢ&7] &f%prefix% &#FF8B1D%player% &f%suffix%&#FF8B1D:&f %message%'
    range: -1
    symbol: '!'
    cooldown: -1
    viewing-perms: javachats.global.view
    sending-perms: javachats.global.send
    sound: ''

messages:
  reload: '&aПлагин перезагружен!'
