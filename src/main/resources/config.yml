  cooldown: '&cПодождите немного перед отправкой сообщения.'
  no-player: '&cИгрок не найден.'
  msg-format-sender: '&7 (&#FF8B1DВы&7) - &7(&#FF8B1D%player%&7) &f- &7%message%'
  msg-format-receiver: '&7 (&#FF8B1D%player%&7) - &7(&#FF8B1DВы&7) &f- &7%message%'
  msg-hover: '&7Нажмите что бы написать &#FF8B1Dличные &7сообщения'
  anti-caps-title: '&cНе капси'
  discord-tech:
    - '&cВ канале техническое уведомление'
  discord-new:
    - '&aВ канале сообщение новое'

ping-chat:
  enabled: true
  highlight:
    target: '&9'
    others: '&7'
  title:
    text: '&9Вас пинганули в чате'
    sub-text: ''
    fade-in: 10
    stay: 70
    fade-out: 20
  sound:
    enable: true
    name: 'BLOCK_NOTE_BLOCK_GUITAR'
    volume: 0.7
    pitch: 2.0
    category: 'MASTER'

