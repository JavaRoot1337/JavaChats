  join:
    enable: true
    messages:
      - '&7[&a+&7] &a%player% &7залетел на сервер!'
      - '&7[&a+&7] &7Приветствуем &a%player%&7!'
      - '&7[&a+&7] &a%player% &7теперь с нами.'
      - '&7[&a+&7] &7К нам присоединился &a%player%&7.'
      - '&7[&a+&7] &a%player% &7ворвался в чат!'
  quit:
    enable: true
    messages:
      - '&7[&c-&7] &c%player% &7покинул нас.'
      - '&7[&c-&7] &c%player% &7вышел с сервера.'
      - '&7[&c-&7] &7Пока, &c%player%&7!'
      - '&7[&c-&7] &c%player% &7отключился.'
