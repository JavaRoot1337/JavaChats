# поддержка - t.me/javaroot
# форматы чата
chat:
  local: '&7[&#F8AE5Bʟ&7] &f%prefix% &#F8AE5B%player% &f%suffix%&#F8AE5B:&f %message%' # локальный
  global: '&7[&#FF8B1Dɢ&7] &f%prefix% &#FF8B1D%player% &f%suffix%&#FF8B1D:&f %message%' # глобальный

# системные ответы
messages:
  reload: '&aКонфиг перезагружен.' # перезагрузка
  reload-failed: '&cОшибка в конфиге — оставлена предыдущая версия.' # ошибка перезагрузки
  no-permission: '&cНет прав.' # нет прав
  cooldown: '&cПодожди перед следующим сообщением.' # кд
  no-player: '&cИгрок не найден.' # нет игрока
  only-players: '&cКоманда доступна только игрокам.' # только для игроков
  usage-javachats: '&7Использование: &a/javachats reload' # использование
  usage-msg: '&7Использование: &c/msg <игрок> <сообщение>' # использование
  cannot-msg-self: '&cНельзя писать самому себе.' # самому себе
  update-available: |
    Доступно обновление.
    Текущая версия: %current%
    Новая версия: %latest%
    GitHub: %github%

# личные сообщения
pm:
  sender: '&7(&#FF8B1DВы&7) &8› &7(&#FF8B1D%player%&7) &f— &7%message%' # отправителю
  receiver: '&7(&#FF8B1D%player%&7) &8› &7(&#FF8B1DВы&7) &f— &7%message%' # получателю
  hover: '&7Нажми, чтобы написать в &#FF8B1DЛС' # подсказка при наведении

# упоминания
ping:
  highlight:
    target: '&9' # цвет упомянутого
    others: '&7' # цвет остальных
  title:
    text: '&9Вас упомянули в чате' # заголовок
    sub-text: '' # подзаголовок

# вход и выход
join-quit:
  join:
    - '&7[&a+&7] &a%player% &7залетел на сервер.'
    - '&7[&a+&7] &7Приветствуем &a%player%&7.'
    - '&7[&a+&7] &a%player% &7теперь в игре.'
    - '&7[&a+&7] &7Подключился &a%player%&7.'
    - '&7[&a+&7] &a%player% &7вошёл в чат.'
  quit:
    - '&7[&c-&7] &c%player% &7покинул сервер.'
    - '&7[&c-&7] &c%player% &7вышел.'
    - '&7[&c-&7] &7До встречи, &c%player%&7.'
    - '&7[&c-&7] &c%player% &7отключился.'
    - '&7[&c-&7] &c%player% &7ушёл из игры.'

# антикапс
anti-caps:
  title: '&cНе капси.' # предупреждение

# антиспам
anti-spam:
  subtitle: '&cНе спамь.' # предупреждение

# антиповтор
anti-repeat: '&cНе повторяй сообщения.' # предупреждение

# логи ии
ai-helper:
  log-message: '&7[&cAI&7] &fИгрок &e%player% &fнаписал: &7%message%'
  log-result: '&7[&cAI&7] &fМодель: &c%model_ai% &f| Вероятность: &e%probability% &f| Вердикт: &c%verdict%'
  verdict-punished: '&4НАКАЗАН'
  verdict-clean: '&aЧИСТ'
  error: '&7[&cAI&7] &cОшибка запроса к нейросети.'
  subtitle: '&cСоблюдай правила сервера.' # предупреждение при цензуре
  added-message: '&aСообщение добавлено в %list%.' # добавлено сообщение
  already-added: '&cСообщение уже есть в этом списке.' # уже добавлено
  disabled: '&cAIHelper отключён или не настроен.' # отключён
  usage-aihelper: '&7Использование: &a/aihelper add <plus|minus> <сообщение>' # использование
