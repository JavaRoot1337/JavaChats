# Форматы чатов
chat:
  local: '&7[&#F8AE5Bʟ&7] &f%prefix% &#F8AE5B%player% &f%suffix%&#F8AE5B:&f %message%' # Локальный чат
  global: '&7[&#FF8B1Dɢ&7] &f%prefix% &#FF8B1D%player% &f%suffix%&#FF8B1D:&f %message%' # Глобальный чат

# Системные сообщения
messages:
  reload: '&aПлагин перезагружен!' # Перезагрузка конфига
  no-permission: '&cУ вас нет прав.' # Отсутствие прав
  cooldown: '&cПодождите немного перед отправкой сообщения.' # Задержка отправки
  no-player: '&cИгрок не найден.' # Игрок не найден для ЛС
  only-players: '&cТолько игроки могут писать личные сообщения.' # Отправка ЛС из консоли

# Личные сообщения (/msg)
pm:
  sender: '&7 (&#FF8B1DВы&7) - &7(&#FF8B1D%player%&7) &f- &7%message%' # Формат для отправителя
  receiver: '&7 (&#FF8B1D%player%&7) - &7(&#FF8B1DВы&7) &f- &7%message%' # Формат для получателя
  hover: '&7Нажмите что бы написать &#FF8B1Dличные &7сообщения' # Подсказка при наведении на ник

# Упоминания (пинг) игроков в чате
ping:
  highlight:
    target: '&9' # Цвет ника для того, кого упомянули
    others: '&7' # Цвет ника для остальных игроков
  title:
    text: '&9Вас пинганули в чате' # Заголовок на экране
    sub-text: '' # Подзаголовок на экране

# Сообщения при входе и выходе игроков
join-quit:
  join:
    - '&7[&a+&7] &a%player% &7залетел на сервер!'
    - '&7[&a+&7] &7Приветствуем &a%player%&7!'
    - '&7[&a+&7] &a%player% &7теперь с нами.'
    - '&7[&a+&7] &7К нам присоединился &a%player%&7.'
    - '&7[&a+&7] &a%player% &7ворвался в чат!'
  quit:
    - '&7[&c-&7] &c%player% &7покинул нас.'
    - '&7[&c-&7] &c%player% &7вышел с сервера.'
    - '&7[&c-&7] &7Пока, &c%player%&7!'
    - '&7[&c-&7] &c%player% &7отключился.'
    - '&7[&c-&7] &7Мы будем скучать по &c%player%&7.'

# Анти-капс
anti-caps:
  title: '&cНе капси' # Заголовок предупреждения

# Сообщения из Discord
discord:
  tech:
    - '&cВ канале техническое уведомление'
  new:
    - '&aВ канале сообщение новое'
