# форматы
chat:
  local: '&7[&#F8AE5Bʟ&7] &f%prefix% &#F8AE5B%player% &f%suffix%&#F8AE5B:&f %message%' # локальный
  global: '&7[&#FF8B1Dɢ&7] &f%prefix% &#FF8B1D%player% &f%suffix%&#FF8B1D:&f %message%' # глобальный

# системные
messages:
  reload: '&aПлагин перезагружен!' # перезагрузка
  no-permission: '&cУ вас нет прав.' # нет прав
  cooldown: '&cПодождите немного перед отправкой сообщения.' # кд
  no-player: '&cИгрок не найден.' # нет игрока
  only-players: '&cТолько игроки могут писать личные сообщения.' # только для игроков
  usage-javachats: '&7Использование: &a/javachats reload' # использование
  usage-msg: '&7Использование: &c/msg <игрок> <сообщение>' # использование
  cannot-msg-self: '&cНельзя писать самому себе.' # самому себе

# лс
pm:
  sender: '&7 (&#FF8B1DВы&7) - &7(&#FF8B1D%player%&7) &f- &7%message%' # отправителю
  receiver: '&7 (&#FF8B1D%player%&7) - &7(&#FF8B1DВы&7) &f- &7%message%' # получателю
  hover: '&7Нажмите что бы написать &#FF8B1Dличные &7сообщения' # подсказка наведении

# упоминания
ping:
  highlight:
    target: '&9' # цвет упомянутого
    others: '&7' # цвет остальных
  title:
    text: '&9Вас пинганули в чате' # заголовок
    sub-text: '' # подзаголовок

# вход/выход
join-quit:
  join:
    - '&7[&a+&7] &a%player% &7залетел на сервер!'
    - '&7[&a+&7] &7Приветствуем &a%player%&7!'
    - '&7[&a+&7] &a%player% &7теперь с нами.'
    - '&7[&a+&7] &7К нам присоединился &a%player%&7.'
    - '&7[&a+&7] &a%player% &7ворвался в чат!'
  quit:
    - '&7[&c-&7] &c%player% &7покинул нас.'
    - '&7[&c-&7] &c%player% &7вышел с сервера.'
    - '&7[&c-&7] &7Пока, &c%player%&7!'
    - '&7[&c-&7] &c%player% &7отключился.'
    - '&7[&c-&7] &7Мы будем скучать по &c%player%&7.'

# капс
anti-caps:
  title: '&cНе капси' # предупреждение

# спам
anti-spam:
  subtitle: '&cБЕЗ СПАМА!!!' # предупреждение

# повторы
anti-repeat: '&cНе повторяйте сообщения!' # предупреждение

# логи ии
ai-helper:
  log-message: '&7[&cAI&7] &fИгрок &e%player% &fнаписал: &7%message%'
  log-result: '&7[&cAI&7] &fМодель: &c%model_ai% &f| Вероятность: &e%probability% &f| Вердикт: &c%verdict%'
  verdict-punished: '&4НАКАЗАН'
  verdict-clean: '&aЧИСТ'
  error: '&7[&cAI&7] &cОшибка при запросе к нейросети.'
  subtitle: '&cНе нарушайте правила сервера!' # предупреждение при цензуре
  added-message: '&aСообщение добавлено в список %list%!' # добавлено сообщение
  already-added: '&cЭто сообщение уже добавлено в этот список!' # уже добавлено
  disabled: '&cAIHelper отключен или не инициализирован.' # отключен
  usage-aihelper: '&7Использование: &a/aihelper add <plus|minus> <сообщение>' # использование
